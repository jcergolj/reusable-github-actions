name: "code-formatter"
on:
  workflow_call:
    inputs:
      skip-npm:
        description: 'Whether to skip installing NPM dependencies'
        default: false
        type: boolean
      pint-blade:
        description: 'Whether to run Laravel Pint with Blade formatting enabled'
        default: false
        type: boolean

jobs:
  code-formatter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.4"]
    steps:
      - name: PHP Setup
        uses: jcergolj/reusable-github-actions/.github/actions/php-setup@master
        with:
          php-version: ${{ matrix.php }}

      - name: Composer
        uses: jcergolj/reusable-github-actions/.github/actions/composer-setup@master

      - name: NPM
        uses: jcergolj/reusable-github-actions/.github/actions/npm-setup@master
        with:
          skip-npm: ${{ inputs.skip-npm }}

      - name: Install Laravel Pint Blade dependencies
        if: ${{ inputs.pint-blade == true }}
        run: npm install --no-save --no-package-lock prettier prettier-plugin-blade prettier-plugin-tailwindcss

      - name: Run Prettier - format js files
        if: ${{ inputs.skip-npm == false }}
        run: npm run format-js

      - name: Run Prettier - format blade files
        if: ${{ inputs.skip-npm == false }}
        run: npm run format-blade

      - name: Run Rector
        uses: jcergolj/reusable-github-actions/.github/actions/rector@master

      - name: Run Laravel Pint with Blade
        if: ${{ inputs.pint-blade == true }}
        run: vendor/bin/pint --blade

      - name: Run Laravel Pint
        if: ${{ inputs.pint-blade == false }}
        run: vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: code auto-format
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
