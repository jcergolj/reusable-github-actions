name: "deploy"
on:
  push:
    branches:
      - master
  workflow_call:
    secrets:
      DEPLOY_SSH_PRIVATE_KEY:
        description: "Private SSH key for the production deployer user"
        required: true
      PAT_TOKEN:
        description: "GitHub token used by secret scanning workflows"
        required: true

jobs:
  tests:
    uses: jcergolj/reusable-github-actions/.github/workflows/tests.yml@master
    secrets: inherit

  phpstan:
    uses: jcergolj/reusable-github-actions/.github/workflows/larastan.yml@master
    secrets: inherit

  pint:
    runs-on: ubuntu-latest
    steps:
      - name: PHP Setup
        uses: jcergolj/reusable-github-actions/.github/actions/php-setup@master
        with:
          php-version: "8.5"

      - name: Composer
        uses: jcergolj/reusable-github-actions/.github/actions/composer-setup@master

      - name: Check Laravel Pint
        run: vendor/bin/pint --test

  rector:
    runs-on: ubuntu-latest
    steps:
      - name: PHP Setup
        uses: jcergolj/reusable-github-actions/.github/actions/php-setup@master
        with:
          php-version: "8.5"

      - name: Composer
        uses: jcergolj/reusable-github-actions/.github/actions/composer-setup@master

      - name: Check Rector
        run: vendor/bin/rector process --dry-run --config=rector.php

  envy:
    uses: jcergolj/reusable-github-actions/.github/workflows/envy.yml@master
    secrets: inherit

  gitleaks:
    uses: jcergolj/reusable-github-actions/.github/workflows/gitleaks.yml@master
    secrets: inherit

  trufflehog:
    uses: jcergolj/reusable-github-actions/.github/workflows/trufflehog-scan.yml@master
    secrets: inherit

  deploy:
    needs:
      - tests
      - phpstan
      - pint
      - rector
      - envy
      - gitleaks
      - trufflehog
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy with Deployer
        run: vendor/bin/dep deploy production
